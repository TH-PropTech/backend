# Chạy backend trên EC2: docker compose -f docker-compose.prod.yml up -d --build
# Redis chạy ở máy riêng (REDIS_URL trong .env). MongoDB: dùng Atlas hoặc bật profile local-db:
#   docker compose -f docker-compose.prod.yml --profile local-db up -d --build
# Khi dùng profile local-db, đặt DATABASE_URL=mongodb://mongodb:27017/th_proptech trong .env.

services:
  backend:
    build: .
    image: th-proptech-api
    container_name: th-proptech-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      # Chỉ Nginx trên cùng máy được gọi vào; không mở 3001 ra internet
      - '127.0.0.1:3001:3001'
    volumes:
      - ./uploads:/app/uploads
      - ./.data:/app/.data
    mem_limit: 768m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  mongodb:
    profiles: [local-db]
    image: mongo:7
    container_name: th-proptech-mongodb
    restart: unless-stopped
    # Giới hạn cache WiredTiger để không tranh RAM với Node trên máy nhỏ
    command: ['mongod', '--wiredTigerCacheSizeGB', '0.25']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodb-data:/data/db
    mem_limit: 512m
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb-data:
